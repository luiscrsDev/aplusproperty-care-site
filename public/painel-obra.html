<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/icon">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Painel de Obra APLUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: navy masthead with project facts, sticky tab rail, then one working view per tab (overview cards, Gantt, editable record tables); edits open a side sheet */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#eceef3; --fg:#121a2b; --muted:#5a6477; --line:#dde1e9;
  --navy:#010741; --navy-fg:#ffffff; --gold:#d00a12; --gold-soft:#fbe3e4;
  --good:#2b7550; --good-bg:#dcefe4; --warn:#9a6110; --warn-bg:#fbeed2;
  --bad:#ad3428; --bad-bg:#f9e1dd; --info:#2c5aa0; --info-bg:#e1eaf7; --neutral-bg:#e9ebf0;
  --display:"Montserrat", "Public Sans", system-ui, sans-serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111214; --surface:#1a1c20; --sunk:#141518; --fg:#eceef2; --muted:#a0a5b0; --line:#2c2f36;
  --navy:#010741; --navy-fg:#ffffff; --gold:#ff5c5c; --gold-soft:#3a1719;
  --good:#6fc796; --good-bg:#16301f; --warn:#e5b55a; --warn-bg:#36290f;
  --bad:#f08a7c; --bad-bg:#3a1b17; --info:#8fb3ec; --info-bg:#172743; --neutral-bg:#26292f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111214; --surface:#1a1c20; --sunk:#141518; --fg:#eceef2; --muted:#a0a5b0; --line:#2c2f36;
  --navy:#010741; --navy-fg:#ffffff; --gold:#ff5c5c; --gold-soft:#3a1719;
  --good:#6fc796; --good-bg:#16301f; --warn:#e5b55a; --warn-bg:#36290f;
  --bad:#f08a7c; --bad-bg:#3a1b17; --info:#8fb3ec; --info-bg:#172743; --neutral-bg:#26292f; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* masthead */
.mast{background:var(--navy);color:var(--navy-fg);border-bottom:3px solid #d00a12}
.mast .wrap{padding-block:22px 18px;display:grid;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.mast h1{font-family:var(--display);font-weight:600;font-size:clamp(22px,4vw,30px);line-height:1.15;letter-spacing:.01em;margin:0;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;opacity:.88}
.facts b{font-weight:600}
.status-line{font-size:12.5px;opacity:.75}
.logo{display:block;line-height:0}.logo img{height:52px;width:auto;max-width:100%}
.mright{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.langbar{display:inline-flex;border:1px solid color-mix(in srgb,var(--navy-fg) 35%,transparent);border-radius:99px;overflow:hidden}
.langbar button{background:none;border:0;color:var(--navy-fg);font-weight:700;font-size:12px;letter-spacing:.04em;padding:5px 11px;cursor:pointer}
.langbar button[aria-pressed="true"]{background:var(--navy-fg);color:var(--navy)}
.mtop{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.projbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.projbar select{background:transparent;color:var(--navy-fg);border:1px solid color-mix(in srgb,var(--navy-fg) 35%,transparent);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;max-width:240px}
.projbar select option{color:var(--fg);background:var(--surface)}
.mbtn{background:none;border:1px solid color-mix(in srgb,var(--navy-fg) 35%,transparent);color:var(--navy-fg);border-radius:8px;padding:6px 10px;font-weight:600;font-size:12.5px;cursor:pointer}
.tag-urg{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--bad-bg);color:var(--bad);border-radius:4px;padding:1px 6px;vertical-align:1px}

/* tabs */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:13px 12px 11px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold);border-bottom-width:3px}
.tab:hover{color:var(--fg)}
.tab .ct{font-family:var(--mono);font-size:10.5px;background:var(--neutral-bg);color:var(--muted);border-radius:99px;padding:1px 6px}
.tab .ct.hot{background:var(--bad-bg);color:var(--bad)}

main{padding-block:20px 80px}
.view{display:grid;gap:18px}
h2.sec{font-family:var(--display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
.sec-sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.head-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--info);border-radius:10px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi.alert{border-top-color:var(--bad)}.kpi.gold{border-top-color:var(--gold)}.kpi.ok{border-top-color:var(--good)}
.kpi .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.alert{border-color:var(--bad)} .kpi.alert .v{color:var(--bad)}
.kpi.gold .v{color:var(--info)}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}
.panel h3{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.mini{list-style:none;margin:0;padding:0}
.mini li{padding:9px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;cursor:pointer}
.mini li:first-child{border-top:0}
.mini li:hover{background:var(--sunk)}
.mini .d{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px}
.mini .t{min-width:0}
.mini .t small{display:block;color:var(--muted);font-size:12px}
.mini .empty{color:var(--muted);cursor:default;grid-template-columns:1fr}
.mini .empty:hover{background:none}

/* pills */
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap;background:var(--neutral-bg);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.code{font-family:var(--mono);font-size:11.5px;color:var(--gold);font-weight:500}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar select,.bar input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13.5px}
.bar input[type=search]{min-width:0;flex:1 1 180px}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13.5px;cursor:pointer;background:var(--navy);color:var(--navy-fg)}
:root[data-theme="dark"] .btn{background:var(--gold);color:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{background:var(--gold);color:#ffffff}}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-fg)}

/* tables */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
tr.grp td{background:var(--bg);font-weight:700;font-size:12.5px;cursor:default;padding-block:8px;color:var(--fg);letter-spacing:.02em}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:0}
tr.grp:hover td{background:var(--bg)}
td.num,td.date{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;white-space:pre-wrap}
tr.late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.notice{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted)}
.notice strong{color:var(--fg)}

/* gantt */
.gantt{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto;position:relative}
.g-inner{position:relative}
.g-row{display:flex;border-top:1px solid var(--line);min-height:30px}
.g-row.g-grp{background:var(--sunk)}
.g-lab{position:sticky;left:0;z-index:2;background:var(--surface);flex:0 0 250px;padding:6px 10px;font-size:12.5px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.g-grp .g-lab{background:var(--sunk);font-weight:700;font-size:12px;cursor:default}
.g-track{position:relative;flex:0 0 auto}
.g-head{position:sticky;top:0}
.g-head .g-lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;cursor:default}
.g-wk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:2px 0 0 3px}
.g-mo{position:absolute;top:0;font-size:11px;font-weight:700;color:var(--fg);padding:2px 0 0 3px;letter-spacing:.06em;text-transform:uppercase}
.g-bar{position:absolute;top:7px;height:16px;border-radius:4px;background:var(--pc,var(--info));cursor:pointer;min-width:6px}
.g-bar.st-p{opacity:.38}
.g-bar.st-a{opacity:1;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--pc)}
.g-bar.st-c{opacity:.9;background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,255,255,.35) 5px 7px)}
.g-bar.st-b{opacity:1;outline:2px dashed var(--bad);outline-offset:1px}
.g-bar.s-good{background:var(--good)} .g-bar.s-warn{background:var(--warn)} .g-bar.s-bad{background:var(--bad)} .g-bar.s-neutral{background:var(--muted);opacity:.55}
.g-bar.late{outline:2px solid var(--bad);outline-offset:1px}
.g-ms{position:absolute;top:8px;width:13px;height:13px;transform:rotate(45deg);background:var(--gold);cursor:pointer}
.g-line{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--fg);z-index:1;pointer-events:none}
.g-line.goal{border-left:2px dashed var(--gold)}
.g-band{position:absolute;top:0;bottom:0;background:var(--gold-soft);opacity:.6;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,20,.45);z-index:30}
.sheet{position:fixed;z-index:31;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet header h3{margin:0;font-family:var(--display);font-weight:600;font-size:18px}
.sheet form{flex:1;overflow-y:auto;padding:16px 18px;display:grid;gap:12px;align-content:start}
.fld{display:grid;gap:4px}
.fld label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;min-width:0}
.fld textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}

/* quick controls (punch list) */
.qc{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qc select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;font-weight:600;max-width:150px}
.qc select.unset{color:var(--muted);font-weight:500}
.qseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qseg button{border:0;background:var(--surface);padding:5px 9px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-left:1px solid var(--line)}
.qseg button:first-child{border-left:0}
.qseg button[aria-pressed="true"][data-v="Open"]{background:var(--neutral-bg);color:var(--fg)}
.qseg button[aria-pressed="true"][data-v="Andamento"]{background:var(--warn-bg);color:var(--warn)}
.qseg button[aria-pressed="true"][data-v="Closed"]{background:var(--good-bg);color:var(--good)}
.readonly .qc{pointer-events:none}
/* diário */
.dsec{display:grid;gap:10px}
.dh{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;gap:8px}
.dday{font-family:var(--display);font-weight:600;font-size:14px;margin-top:6px}
.dlist{display:grid;gap:8px}
.dcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--info);border-radius:10px;padding:12px 14px;display:grid;gap:6px;cursor:pointer;min-width:0}
.dcard:hover{background:var(--sunk)}
.dcard.s-Realizada{border-left-color:var(--good)}.dcard.s-Cancelada{border-left-color:var(--muted)}.dcard.s-Remarcada{border-left-color:var(--warn)}
.dtop{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.dtime{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dmain{display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap}
.dpac{font-size:12.5px;color:var(--muted)}
.ddesc{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.dmeta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.dfotos{display:flex;gap:6px;flex-wrap:wrap}
.dph{position:relative;display:block}
.dfotos img{width:76px;height:76px;object-fit:cover;border-radius:6px;background:var(--sunk);display:block}
.dphx{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:99px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.dsm{justify-self:start;padding:5px 11px;font-size:12.5px}
.upl{justify-self:start;cursor:pointer;position:relative;display:inline-flex;align-items:center}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.readonly .upl,.readonly .dphx,.readonly .dsm{display:none}
/* report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;white-space:pre-wrap;font-size:14px;line-height:1.55;max-width:78ch;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:600;z-index:40}
.readonly .add,.readonly .sheet footer .save,.readonly .sheet footer .del{display:none}

@media (max-width:640px){
  .g-lab{flex-basis:150px}
  .two{grid-template-columns:1fr}
  .sheet{width:100%}
}
@media (prefers-reduced-motion:no-preference){.tab{transition:color .15s,border-color .15s}}
</style>
</head><body>
<header class="mast">
  <div class="wrap">
    <div class="mtop"><a href="/" class="logo" aria-label="APLUS Property Care"><img src="/aplus-logo-wide.png" alt="APLUS Property Care" width="600" height="217"></a><div class="mright"><div class="projbar" id="projBar"></div><div class="langbar" id="langBar" data-noi18n></div></div></div>
    <div class="eyebrow">Painel de obra</div>
    <h1 id="pName">Painel de Obra</h1>
    <div class="facts" id="facts"></div>
    <div class="status-line" id="conn">Conectando ao banco de dados…</div>
  </div>
</header>

<nav class="rail"><div class="wrap"><div class="tabs" role="tablist" id="tabs"></div></div></nav>

<main class="wrap" id="main"></main>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="shTitle">
  <header><h3 id="shTitle">Editar</h3><button class="x" id="shClose" aria-label="Fechar">×</button></header>
  <form id="shForm"></form>
  <footer>
    <button class="btn danger del" type="button" id="shDel">Excluir</button>
    <span style="display:flex;gap:8px"><button class="btn ghost" type="button" id="shCancel">Cancelar</button><button class="btn save" type="submit" form="shForm" id="shSave">Salvar</button></span>
  </footer>
</aside>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---------- Idiomas (EN padrão · PT · ES) ----------
   O código usa textos-fonte em português; esta camada troca o texto exibido conforme o idioma.
   Valores gravados no banco (status etc.) nunca mudam: só o rótulo na tela. */
const LANGS=["en","pt","es"];
const savedLang=pid=>{try{const l=localStorage.getItem("aplus-lang:"+pid);return LANGS.includes(l)?l:null}catch(_){return null}};
let LANG=(()=>{const m=location.pathname.match(/^\/(?:obras|cliente)\/([^\/?#]+)/);let l=m?savedLang(decodeURIComponent(m[1])):null;
  if(!l){try{l=localStorage.getItem("aplus-lang")}catch(_){}}return LANGS.includes(l)?l:"en"})();
const loc=()=>({en:"en-US",pt:"pt-BR",es:"es-US"}[LANG]);
const W3=(pt,en,es)=>LANG==="en"?en:LANG==="es"?es:pt;
// chave (texto-fonte) : [inglês, espanhol, português opcional quando a chave não é português]
const I18N={
"Painel de obra":["Project dashboard","Panel de obra"],"Painel de Obra":["Project Dashboard","Panel de Obra"],
"Conectando ao banco de dados…":["Connecting to the database…","Conectando a la base de datos…"],
"Editar":["Edit","Editar"],"Fechar":["Close","Cerrar"],"Excluir":["Delete","Eliminar"],"Cancelar":["Cancel","Cancelar"],"Salvar":["Save","Guardar"],

function tr(s){
  if(s==null)return s;const str=String(s);if(LANG==="pt"&&!/^(Open|Andamento|Closed)$/.test(str.trim()))return str;
  const m=str.match(/^(\s*)([\s\S]*?)(\s*)$/);const k=m[2];if(!k)return str;
  const pick=e=>LANG==="en"?e[0]:LANG==="es"?e[1]:(e[2]??k);
  let out=null;const e=I18N[k];
  if(e)out=pick(e);
  else if(k.endsWith(":")&&I18N[k.slice(0,-1)])out=pick(I18N[k.slice(0,-1)])+":";
  else if(LANG!=="pt"){for(const [rx,en,es] of I18N_RX){if(rx.test(k)){out=k.replace(rx,LANG==="en"?en:es);break}}}
  return out==null?str:m[1]+out+m[3];
}
const I18N_SKIP="script,style,textarea,[data-noi18n]";
const I18N_ATTRS=["placeholder","title","aria-label"];
const I18N_ORIG=new WeakMap(), I18N_SET=new WeakMap();
function trAttrs(el){
  let o=I18N_ORIG.get(el);if(!o||typeof o!=="object"){o={};I18N_ORIG.set(el,o)}
  let s=I18N_SET.get(el);if(!s||typeof s!=="object"){s={};I18N_SET.set(el,s)}
  for(const a of I18N_ATTRS){if(!el.hasAttribute(a))continue;const cur=el.getAttribute(a);if(o[a]===undefined||cur!==s[a])o[a]=cur;const v=tr(o[a]);s[a]=v;if(v!==cur)el.setAttribute(a,v)}
}
function trNode(n){
  if(n.nodeType===3){const p=n.parentElement;if(!p||p.closest(I18N_SKIP))return;
    let o=I18N_ORIG.get(n);if(o===undefined||n.nodeValue!==I18N_SET.get(n)){o=n.nodeValue;I18N_ORIG.set(n,o)}
    const v=tr(o);I18N_SET.set(n,v);if(v!==n.nodeValue)n.nodeValue=v;return}
  if(n.nodeType!==1||n.matches(I18N_SKIP))return;
  trAttrs(n);for(const c of n.childNodes)trNode(c);
}
new MutationObserver(ms=>{for(const m of ms){if(m.type==="attributes")trAttrs(m.target);else m.addedNodes.forEach(trNode)}})
  .observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:I18N_ATTRS});

const pd=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const today=(()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())})();
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const DAY=864e5;
const diff=(a,b)=>Math.round((a-b)/DAY);
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const fd=s=>{const d=pd(s);if(!d)return s||"—";const dd=String(d.getDate()).padStart(2,"0"),mm=String(d.getMonth()+1).padStart(2,"0");return (LANG==="en"?`${mm}/${dd}`:`${dd}/${mm}`)+(d.getFullYear()!==2026?"/"+String(d.getFullYear()).slice(2):"")};

/* ---------- Cálculos ---------- */
const isDone=t=>t.status==="Concluído";
const lateTask=t=>{const f=pd(t.fim);return f&&f<today&&!isDone(t)};
function clientDelayDays(){
  // união dos intervalos em que decisões ficaram além do prazo (prorrogação do bônus, cl. 6.3)
  const iv=[];
  D.decisoes.forEach(x=>{const p=pd(x.prazo);if(!p||!pd(x.pedidoEm))return;const r=pd(x.respondidoEm)||(x.status==="Respondida"?null:today);if(r&&r>p)iv.push([p,r])});
  iv.sort((a,b)=>a[0]-b[0]);let tot=0,cur=null;
  iv.forEach(([s,e])=>{if(!cur){cur=[s,e];return}if(s<=cur[1]){if(e>cur[1])cur[1]=e}else{tot+=diff(cur[1],cur[0]);cur=[s,e]}});
  if(cur)tot+=diff(cur[1],cur[0]);return tot;
}
const interior=t=>PROJ.interno?String(t.pacote||"").startsWith(PROJ.interno):true;
const openPunch=()=>D.punch.filter(p=>p.status!=="Closed");

}
function counts(){
  return {
    tarefas:D.tarefas.filter(lateTask).length,
    decisoes:D.decisoes.filter(d=>d.status!=="Respondida").length,
    pedidos:D.pedidos.filter(p=>p.status==="A pedir").length,
    riscos:D.riscos.filter(r=>r.status==="Aberto"&&r.impacto==="Alto").length,
    punch:D.punch.filter(p=>p.status!=="Closed").length,
    diario:D.diario.filter(a=>a.status==="Agendada"&&a.data===iso(today)).length
  };
}
function renderTabs(){
  const c=counts();

}

}

function viewGeral(){
  const meta=pd(PROJ.conclusaoInterna);const dl=meta?diff(meta,today):null;
  const intT=D.tarefas.filter(interior), intDone=intT.filter(isDone).length;
  const late=D.tarefas.filter(lateTask);
  const openDec=D.decisoes.filter(d=>d.status!=="Respondida");
  const lateDec=openDec.filter(d=>{const p=pd(d.prazo);return p&&p<today});
  const toOrder=D.pedidos.filter(p=>p.status==="A pedir");
  const pOpen=openPunch(), pUrg=pOpen.filter(p=>p.urgente==="Sim");
  const delay=clientDelayDays();
  const nextW=D.tarefas.filter(t=>{const s=pd(t.inicio),f=pd(t.fim);const lim=addD(today,14);return !isDone(t)&&((s&&s>=today&&s<=lim)||(f&&f>=today&&f<=lim))}).sort((a,b)=>(a.inicio||"").localeCompare(b.inicio||""));
  const hiR=D.riscos.filter(r=>r.status!=="Fechado"&&r.impacto==="Alto");
  const li=(d,t,sub,right,k,id)=>`<li data-open="${k}" data-id="${esc(id)}"><span class="d">${d}</span><span class="t">${t}${sub?`<small>${sub}</small>`:""}</span>${right||""}</li>`;
  const emp=m=>`<li class="empty">${m}</li>`;
  const K=[];
  if(meta)K.push(`<div class="kpi ${dl<14?"gold":""}"><span class="l">Meta ${fd(PROJ.conclusaoInterna)}</span><span class="v">${Math.max(0,dl)}</span><span class="s">dias corridos restantes</span></div>`);
  if(D.tarefas.length)K.push(`<div class="kpi ok"><span class="l">${PROJ.interno?"Interno concluído":"Tarefas concluídas"}</span><span class="v">${intDone}/${intT.length}</span><span class="s">${PROJ.interno?"tarefas dos pacotes internos":"do cronograma"}</span></div>`,`<div class="kpi ${late.length?"alert":""}"><span class="l">Tarefas atrasadas</span><span class="v">${late.length}</span><span class="s">fim já passou, sem conclusão</span></div>`);
  if(D.punch.length)K.push(`<div class="kpi ${pUrg.length?"alert":""}"><span class="l">Punch list</span><span class="v">${pOpen.length}<span style="font-size:16px;color:var(--muted)">/${D.punch.length}</span></span><span class="s">abertas · ${pUrg.length} urgente(s)</span></div>`);
  if(D.decisoes.length)K.push(`<div class="kpi ${lateDec.length?"alert":""}"><span class="l">Decisões do cliente</span><span class="v">${openDec.length}</span><span class="s">abertas · ${lateDec.length} fora do prazo</span></div>`);
  if(D.pedidos.length)K.push(`<div class="kpi ${toOrder.length?"alert":""}"><span class="l">Pedidos a fazer</span><span class="v">${toOrder.length}</span><span class="s">itens sem pedido</span></div>`);
  if(meta&&PROJ.bonus)K.push(`<div class="kpi gold"><span class="l">Prazo do bônus</span><span class="v">${fd(iso(addD(meta,delay)))}</span><span class="s">${delay} dia(s) de atraso do cliente registrados</span></div>`);
  const P=[];
  {const up=D.diario.filter(a=>a.status==="Agendada"&&pd(a.data)&&pd(a.data)>=today).sort((a,b)=>((a.data||"")+(a.hora||"")).localeCompare((b.data||"")+(b.hora||"")));
   P.push(`<section class="panel"><h3>Próximas visitas <span>${up.length}</span></h3><ul class="mini">${up.slice(0,10).map(a=>li(fd(a.data),esc(a.empresa||""),[tr(a.tipo),a.hora,a.pacote&&pacLabel(a.pacote)].filter(Boolean).map(esc).join(" · "),pill(a.status),"diario",a.id)).join("")||emp("Nenhuma visita agendada.")}</ul></section>`)}
  if(D.punch.length){const pl=pOpen.slice().sort((a,b)=>(b.urgente==="Sim")-(a.urgente==="Sim")||(a.ordem||0)-(b.ordem||0));P.push(`<section class="panel"><h3>Punch list aberta <span>${pOpen.length}</span></h3><ul class="mini">${pl.slice(0,12).map(p=>li(p.prazo?fd(p.prazo):"",esc(p.item)+(p.urgente==="Sim"?'<span class="tag-urg">Urgente</span>':""),[p.ambiente,p.resp,p.obs].filter(Boolean).map(esc).join(" · "),pill(p.status),"punch",p.id)).join("")||emp("Tudo fechado.")}${pl.length>12?`<li class="empty">+ ${pl.length-12} na aba Punch list</li>`:""}</ul></section>`)}
  if(D.tarefas.length)P.push(`<section class="panel"><h3>Próximos 14 dias <span>${nextW.length}</span></h3><ul class="mini">${nextW.slice(0,12).map(t=>li(fd(t.inicio),esc(t.nome),esc(pacLabel(t.pacote))+" · até "+fd(t.fim),pill(t.status),"tarefas",t.id)).join("")||emp("Nada começa ou termina nas próximas duas semanas.")}</ul></section>`);

function compressImage(file){return new Promise(res=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>res(b||file),"image/jpeg",.82)};
  img.onerror=()=>{URL.revokeObjectURL(url);res(file)};img.src=url})}

const SB_URL="https://vewqlrfiqbczuytsortg.supabase.co", SB_KEY="sb_publishable_09vPDW5_c-qrMZ4GeaTQXg_M-QU_O8K";

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const mapErr=e=>({code:(e&&(e.code==="42501"||/row-level security|permission/i.test(e.message||"")))?"invalid_argument":"unavailable",message:e&&e.message});
const listeners={};
function kick(path){(listeners[path]||[]).forEach(f=>f())}
function parsePath(path){const s=path.split("/");return s.length===1?{t:"p"}:{t:"d",projeto:s[1],colecao:s[2]}}
async function fetchRows(P){
  if(P.t==="p"){const{data,error}=await sb.from("obra_projetos").select("id,data");if(error)throw mapErr(error);return data}
  const{data,error}=await sb.from("obra_docs").select("id,data").eq("projeto",P.projeto).eq("colecao",P.colecao);if(error)throw mapErr(error);return data;
}
function makeDb(){return{collection(path){
  const P=parsePath(path);
  const tbl=P.t==="p"?"obra_projetos":"obra_docs";
  const key=id=>P.t==="p"?{id}:{projeto:P.projeto,colecao:P.colecao,id};
  const match=(q,id)=>{const k=key(id);Object.keys(k).forEach(c=>q=q.eq(c,k[c]));return q};
  const docRef=id=>({id,
    async set(data){const{error}=await sb.from(tbl).upsert({...key(id),data,updated_at:new Date().toISOString()});if(error)throw mapErr(error);kick(path)},
    async update(patch){const{data:row,error:e1}=await match(sb.from(tbl).select("data"),id).maybeSingle();if(e1)throw mapErr(e1);
      const{error}=await match(sb.from(tbl).update({data:{...(row?row.data:{}),...patch},updated_at:new Date().toISOString()}),id);if(error)throw mapErr(error);kick(path)},
    async delete(){const{error}=await match(sb.from(tbl).delete(),id);if(error)throw mapErr(error);kick(path)}
  });
  return{
    doc(id){return docRef(id||uid())},
    async add(data){const id=uid();await docRef(id).set(data);return docRef(id)},
    onSnapshot(next,onErr){
      let alive=true,t=null;
      const load=()=>{clearTimeout(t);t=setTimeout(async()=>{try{const rows=await fetchRows(P);if(alive)next({docs:rows.map(r=>({id:r.id,data:()=>r.data||{}}))})}catch(e){if(alive&&onErr)onErr(e)}},120)};
      (listeners[path]=listeners[path]||[]).push(load);
      const ch=sb.channel("rt-"+path.replace(/\W/g,"-")+"-"+uid()).on("postgres_changes",{event:"*",schema:"public",table:tbl,...(P.t==="d"?{filter:"projeto=eq."+P.projeto}:{})},()=>load()).subscribe();
      load();
      return()=>{alive=false;clearTimeout(t);listeners[path]=(listeners[path]||[]).filter(f=>f!==load);sb.removeChannel(ch)};
    }
  };
}}}
