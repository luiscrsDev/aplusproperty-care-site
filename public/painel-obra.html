<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/icon">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Painel de Obra APLUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: navy masthead with project facts, sticky tab rail, then one working view per tab (overview cards, Gantt, editable record tables); edits open a side sheet */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#eceef3; --fg:#121a2b; --muted:#5a6477; --line:#dde1e9;
  --navy:#010741; --navy-fg:#ffffff; --gold:#d00a12; --gold-soft:#fbe3e4;
  --good:#2b7550; --good-bg:#dcefe4; --warn:#9a6110; --warn-bg:#fbeed2;
  --bad:#ad3428; --bad-bg:#f9e1dd; --info:#2c5aa0; --info-bg:#e1eaf7; --neutral-bg:#e9ebf0;
  --display:"Montserrat", "Public Sans", system-ui, sans-serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c121d; --surface:#141c2b; --sunk:#101725; --fg:#e5e8ef; --muted:#97a1b4; --line:#253048;
  --navy:#010741; --navy-fg:#ffffff; --gold:#ff5c5c; --gold-soft:#3a1719;
  --good:#6fc796; --good-bg:#16301f; --warn:#e5b55a; --warn-bg:#36290f;
  --bad:#f08a7c; --bad-bg:#3a1b17; --info:#8fb3ec; --info-bg:#172743; --neutral-bg:#1e2738; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c121d; --surface:#141c2b; --sunk:#101725; --fg:#e5e8ef; --muted:#97a1b4; --line:#253048;
  --navy:#010741; --navy-fg:#ffffff; --gold:#ff5c5c; --gold-soft:#3a1719;
  --good:#6fc796; --good-bg:#16301f; --warn:#e5b55a; --warn-bg:#36290f;
  --bad:#f08a7c; --bad-bg:#3a1b17; --info:#8fb3ec; --info-bg:#172743; --neutral-bg:#1e2738; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* masthead */
.mast{background:var(--navy);color:var(--navy-fg)}
.mast .wrap{padding-block:22px 18px;display:grid;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.mast h1{font-family:var(--display);font-weight:600;font-size:clamp(22px,4vw,30px);line-height:1.15;letter-spacing:.01em;margin:0;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;opacity:.88}
.facts b{font-weight:600}
.status-line{font-size:12.5px;opacity:.75}
.logo{display:block;line-height:0}.logo img{height:52px;width:auto;max-width:100%}
.mtop{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.projbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.projbar select{background:transparent;color:var(--navy-fg);border:1px solid color-mix(in srgb,var(--navy-fg) 35%,transparent);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;max-width:240px}
.projbar select option{color:var(--fg);background:var(--surface)}
.mbtn{background:none;border:1px solid color-mix(in srgb,var(--navy-fg) 35%,transparent);color:var(--navy-fg);border-radius:8px;padding:6px 10px;font-weight:600;font-size:12.5px;cursor:pointer}
.tag-urg{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--bad-bg);color:var(--bad);border-radius:4px;padding:1px 6px;vertical-align:1px}

/* tabs */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:13px 12px 11px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold)}
.tab .ct{font-family:var(--mono);font-size:10.5px;background:var(--neutral-bg);color:var(--muted);border-radius:99px;padding:1px 6px}
.tab .ct.hot{background:var(--bad-bg);color:var(--bad)}

main{padding-block:20px 80px}
.view{display:grid;gap:18px}
h2.sec{font-family:var(--display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
.sec-sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.head-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.alert{border-color:var(--bad)} .kpi.alert .v{color:var(--bad)}
.kpi.gold .v{color:var(--info)}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}
.panel h3{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.mini{list-style:none;margin:0;padding:0}
.mini li{padding:9px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;cursor:pointer}
.mini li:first-child{border-top:0}
.mini li:hover{background:var(--sunk)}
.mini .d{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px}
.mini .t{min-width:0}
.mini .t small{display:block;color:var(--muted);font-size:12px}
.mini .empty{color:var(--muted);cursor:default;grid-template-columns:1fr}
.mini .empty:hover{background:none}

/* pills */
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap;background:var(--neutral-bg);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.code{font-family:var(--mono);font-size:11.5px;color:var(--gold);font-weight:500}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar select,.bar input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13.5px}
.bar input[type=search]{min-width:0;flex:1 1 180px}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13.5px;cursor:pointer;background:var(--navy);color:var(--navy-fg)}
:root[data-theme="dark"] .btn{background:var(--gold);color:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{background:var(--gold);color:#ffffff}}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-fg)}

/* tables */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
tr.grp td{background:var(--bg);font-weight:700;font-size:12.5px;cursor:default;padding-block:7px;color:var(--muted)}
tr.grp:hover td{background:var(--bg)}
td.num,td.date{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;white-space:pre-wrap}
tr.late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.notice{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted)}
.notice strong{color:var(--fg)}

/* gantt */
.gantt{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto;position:relative}
.g-inner{position:relative}
.g-row{display:flex;border-top:1px solid var(--line);min-height:30px}
.g-row.g-grp{background:var(--sunk)}
.g-lab{position:sticky;left:0;z-index:2;background:var(--surface);flex:0 0 250px;padding:6px 10px;font-size:12.5px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.g-grp .g-lab{background:var(--sunk);font-weight:700;font-size:12px;cursor:default}
.g-track{position:relative;flex:0 0 auto}
.g-head{position:sticky;top:0}
.g-head .g-lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;cursor:default}
.g-wk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:2px 0 0 3px}
.g-mo{position:absolute;top:0;font-size:11px;font-weight:700;color:var(--fg);padding:2px 0 0 3px;letter-spacing:.06em;text-transform:uppercase}
.g-bar{position:absolute;top:7px;height:16px;border-radius:4px;background:var(--info);opacity:.85;cursor:pointer;min-width:6px}
.g-bar.s-good{background:var(--good)} .g-bar.s-warn{background:var(--warn)} .g-bar.s-bad{background:var(--bad)} .g-bar.s-neutral{background:var(--muted);opacity:.55}
.g-bar.late{outline:2px solid var(--bad);outline-offset:1px}
.g-ms{position:absolute;top:8px;width:13px;height:13px;transform:rotate(45deg);background:var(--gold);cursor:pointer}
.g-line{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--fg);z-index:1;pointer-events:none}
.g-line.goal{border-left:2px dashed var(--gold)}
.g-band{position:absolute;top:0;bottom:0;background:var(--gold-soft);opacity:.6;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,20,.45);z-index:30}
.sheet{position:fixed;z-index:31;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet header h3{margin:0;font-family:var(--display);font-weight:600;font-size:18px}
.sheet form{flex:1;overflow-y:auto;padding:16px 18px;display:grid;gap:12px;align-content:start}
.fld{display:grid;gap:4px}
.fld label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;min-width:0}
.fld textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}

/* report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;white-space:pre-wrap;font-size:14px;line-height:1.55;max-width:78ch;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:600;z-index:40}
.readonly .add,.readonly .sheet footer .save,.readonly .sheet footer .del{display:none}

@media (max-width:640px){
  .g-lab{flex-basis:150px}
  .two{grid-template-columns:1fr}
  .sheet{width:100%}
}
@media (prefers-reduced-motion:no-preference){.tab{transition:color .15s,border-color .15s}}
</style>
</head><body>
<header class="mast">
  <div class="wrap">
    <div class="mtop"><a href="/" class="logo" aria-label="APLUS Property Care"><img src="/aplus-logo-wide.png" alt="APLUS Property Care" width="600" height="217"></a><div class="projbar" id="projBar"></div></div>
    <div class="eyebrow">Painel de obra</div>
    <h1 id="pName">Painel de Obra</h1>
    <div class="facts" id="facts"></div>
    <div class="status-line" id="conn">Conectando ao banco de dados…</div>
  </div>
</header>

<nav class="rail"><div class="wrap"><div class="tabs" role="tablist" id="tabs"></div></div></nav>

<main class="wrap" id="main"></main>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="shTitle">
  <header><h3 id="shTitle">Editar</h3><button class="x" id="shClose" aria-label="Fechar">×</button></header>
  <form id="shForm"></form>
  <footer>
    <button class="btn danger del" type="button" id="shDel">Excluir</button>
    <span style="display:flex;gap:8px"><button class="btn ghost" type="button" id="shCancel">Cancelar</button><button class="btn save" type="submit" form="shForm" id="shSave">Salvar</button></span>
  </footer>
</aside>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---------- Configuração do projeto (dados do contrato) ---------- */
const DEFAULT_PROJ={id:"",nome:"Painel de Obra",entregas:[],pacotes:[]};
/* projeto ativo: a configuração vem do banco (coleção "projetos"); DEFAULT_PROJ é só o ponto de partida */
let PROJ=null, PROJS=[];
const PACS=[],PACN={},PACOPTS=[];
const pacLabel=c=>c?`${c} ${PACN[c]||""}`.trim():"—";
function applyProject(p){
  PROJ=Object.assign({entregas:[],pacotes:[]},p);
  PACS.length=0;PACOPTS.length=0;Object.keys(PACN).forEach(k=>delete PACN[k]);
  (PROJ.pacotes||[]).forEach(x=>{if(!x||!x.c)return;PACS.push([x.c,x.n||""]);PACOPTS.push(x.c);PACN[x.c]=x.n||""});
}
applyProject(DEFAULT_PROJ);

/* tone per status label */
const TONE={
  "Pendente":"","Em andamento":"info","Concluído":"good","Bloqueado":"bad",
  "Medir":"","Cotando":"info","Comparativo enviado":"warn","Aprovado":"good","Contratado":"good","Em execução":"info",
  "Recebida":"info","Recomendada":"warn","Aprovada":"good","Recusada":"",
  "A pedir":"bad","Pedido":"info","Em fabricação":"warn","Embarcado":"info","Entregue":"good",
  "A definir":"","Em projeto":"info","Protocolada":"info","Em análise":"warn","Comentários":"bad","Emitida":"good","Vistorias":"info","Encerrada":"good",
  "Aberta":"warn","Respondida":"good",
  "A vencer":"","Faturada":"info","Paga":"good",
  "Alto":"bad","Médio":"warn","Baixo":"",
  "Aberto":"warn","Mitigado":"info","Fechado":"good",
  "Open":"","Andamento":"info","Closed":"good"
};
const pill=v=>v?`<span class="pill ${TONE[v]??""}">${esc(v)}</span>`:"";

/* ---------- Esquemas das tabelas ---------- */
const S={
  tarefas:{label:"Cronograma",item:"tarefa",group:"pacote",fields:[
    {k:"nome",l:"Tarefa",t:"text",req:1,list:1,main:1},
    {k:"pacote",l:"Pacote",t:"select",o:PACOPTS,fmt:pacLabel},
    {k:"inicio",l:"Início",t:"date",list:1,half:1},
    {k:"fim",l:"Fim",t:"date",list:1,half:1},
    {k:"status",l:"Status",t:"select",o:["Pendente","Em andamento","Concluído","Bloqueado"],list:1,half:1},
    {k:"resp",l:"Responsável",t:"text",list:1,half:1},
    {k:"marco",l:"Marco",t:"select",o:["Não","Sim"],half:1},
    {k:"obs",l:"Observações",t:"textarea",sub:1}]},
  pacotes:{label:"Pacotes",item:"pacote",fields:[
    {k:"cod",l:"Código",t:"select",o:PACOPTS,list:1,half:1,fmt:c=>`<span class="code">${esc(c)}</span>`},
    {k:"status",l:"Status",t:"select",o:["Medir","Cotando","Comparativo enviado","Aprovado","Contratado","Em execução","Concluído"],list:1,half:1},
    {k:"nome",l:"Pacote",t:"text",req:1,list:1,main:1},
    {k:"escopo",l:"Escopo (Anexo A)",t:"textarea",sub:1},
    {k:"medicao",l:"Medição em",t:"date",list:1,half:1},
    {k:"fornecedor",l:"Fornecedor aprovado",t:"text",list:1,half:1},
    {k:"valor",l:"Valor aprovado (US$)",t:"number",list:1,half:1},
    {k:"obs",l:"Observações",t:"textarea"}]},
  cotacoes:{label:"Orçamentos",item:"orçamento",group:"pacote",fields:[
    {k:"pacote",l:"Pacote",t:"select",o:PACOPTS,req:1,fmt:pacLabel},
    {k:"fornecedor",l:"Fornecedor",t:"text",req:1,list:1,main:1},
    {k:"valor",l:"Valor (US$)",t:"number",list:1,half:1},
    {k:"sinal",l:"Sinal (US$)",t:"number",list:1,half:1},
    {k:"prazo",l:"Prazo de entrega",t:"text",list:1,half:1},
    {k:"recebida",l:"Recebida em",t:"date",list:1,half:1},
    {k:"status",l:"Status",t:"select",o:["Recebida","Recomendada","Aprovada","Recusada"],list:1},
    {k:"exclusoes",l:"O que está excluído",t:"textarea",sub:1},
    {k:"obs",l:"Observações",t:"textarea"}]},
  pedidos:{label:"Pedidos",item:"pedido",group:"pacote",fields:[
    {k:"item",l:"Item",t:"text",req:1,list:1,main:1},
    {k:"pacote",l:"Pacote",t:"select",o:PACOPTS,fmt:pacLabel},
    {k:"fornecedor",l:"Fornecedor",t:"text",list:1,half:1},
    {k:"leadtime",l:"Prazo de fabricação",t:"text",list:1,half:1},
    {k:"pedidoEm",l:"Pedido em",t:"date",list:1,half:1},
    {k:"previsao",l:"Previsão de entrega",t:"date",list:1,half:1},
    {k:"status",l:"Status",t:"select",o:["A pedir","Pedido","Em fabricação","Embarcado","Entregue"],list:1},
    {k:"obs",l:"Observações",t:"textarea",sub:1}]},
  licencas:{label:"Licenças",item:"licença",fields:[
    {k:"nome",l:"Licença",t:"text",req:1,list:1,main:1},
    {k:"pacote",l:"Pacote",t:"select",o:PACOPTS,list:1,half:1,fmt:c=>`<span class="code">${esc(c||"")}</span>`},
    {k:"status",l:"Status",t:"select",o:["A definir","Em projeto","Protocolada","Em análise","Comentários","Emitida","Vistorias","Encerrada"],list:1,half:1},
    {k:"empreiteiro",l:"Empreiteiro responsável",t:"text",list:1},
    {k:"protocolo",l:"Nº do processo",t:"text",list:1,half:1},
    {k:"data",l:"Data do último evento",t:"date",list:1,half:1},
    {k:"requisitos",l:"Requisitos",t:"textarea",sub:1},
    {k:"obs",l:"Observações",t:"textarea"}]},
  decisoes:{label:"Decisões",item:"decisão",fields:[

const pd=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};

const isDone=t=>t.status==="Concluído";

function clientDelayDays(){
  // união dos intervalos em que decisões ficaram além do prazo (prorrogação do bônus, cl. 6.3)
  const iv=[];
  D.decisoes.forEach(x=>{const p=pd(x.prazo);if(!p||!pd(x.pedidoEm))return;const r=pd(x.respondidoEm)||(x.status==="Respondida"?null:today);if(r&&r>p)iv.push([p,r])});
  iv.sort((a,b)=>a[0]-b[0]);let tot=0,cur=null;
  iv.forEach(([s,e])=>{if(!cur){cur=[s,e];return}if(s<=cur[1]){if(e>cur[1])cur[1]=e}else{tot+=diff(cur[1],cur[0]);cur=[s,e]}});
  if(cur)tot+=diff(cur[1],cur[0]);return tot;
}
const interior=t=>PROJ.interno?String(t.pacote||"").startsWith(PROJ.interno):true;

  const P=[];

function filterBar(k,extra=""){
  const f=F[k]||(F[k]={q:"",pac:"",st:""});
  const sch=S[k];const st=sch.fields.find(x=>x.k==="status");const hasPac=sch.fields.some(x=>x.k==="pacote");

    ${extra}
    <button class="btn add" data-new="${k}">+ Nova ${sch.item}</button>
  </div>`;
}
function rowsFor(k){
  const f=F[k]||{q:"",pac:"",st:""};const q=(f.q||"").toLowerCase();
  return D[k].filter(r=>(!f.pac||r.pacote===f.pac||r.cod===f.pac)&&(!f.st||r.status===f.st)&&(!q||Object.values(r).join(" ").toLowerCase().includes(q)));
}
function sortRows(k,rows){
  const key={tarefas:"inicio",pedidos:"previsao",decisoes:"prazo",pagamentos:"ordem",riscos:"ordem",pacotes:"ordem",licencas:"ordem",cotacoes:"recebida",punch:"ordem"}[k];
  return rows.slice().sort((a,b)=>{
    if(k==="pacotes"){return PACOPTS.indexOf(a.cod)-PACOPTS.indexOf(b.cod)}
    if(k==="riscos"){const o={Alto:0,Médio:1,Baixo:2};const d=(o[a.impacto]??3)-(o[b.impacto]??3);if(d)return d}
    const va=a[key]??"",vb=b[key]??"";return typeof va==="number"&&typeof vb==="number"?va-vb:String(va).localeCompare(String(vb));
  });
}
function cell(r,fl){

}
function viewTable(k){

    decisoes:"Registre a data de cada pedido e de cada resposta. Atrasos do cliente prorrogam o prazo do bônus dia a dia (cláusula 6.3).",

  if(gk){const rank={};D[k].forEach(r=>{const g=r[gk]||"";const o=gk==="pacote"?PACOPTS.indexOf(g):(r.ordem||0);if(rank[g]==null||o<rank[g])rank[g]=o});
    rows.sort((a,b)=>(rank[a[gk]||""]-rank[b[gk]||""])||String(a[gk]||"").localeCompare(String(b[gk]||""))||0)}

  });
  return `<div class="view">${head}<div class="tbl-wrap"><table><thead><tr>${cols.map(c=>`<th>${c.l}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div></div>`;

function viewTarefas(){
  const seg=`<div class="seg"><button data-gm="gantt" aria-pressed="${ganttMode==="gantt"}">Gantt</button><button data-gm="lista" aria-pressed="${ganttMode==="lista"}">Lista</button></div>`;
  if(ganttMode==="lista"){const v=viewTable("tarefas");return v.replace('<div class="bar">',`<div class="bar">${seg}`)}
  const head=`<div class="head-row"><div><h2 class="sec">Cronograma geral</h2><p class="sec-sub">Sequência do Briefing: elétrica embutida, LED e pré-AV → carpintaria e tetos → cozinha → pintura → persianas, cortinas, AV → punch list.</p></div></div>${filterBar("tarefas",seg)}`;
  const rows=rowsFor("tarefas").filter(t=>pd(t.inicio));
  if(!D.tarefas.length)return `<div class="view">${head}<div class="notice"><strong>Nenhuma tarefa ainda.</strong><br>Use “+ Nova tarefa” para montar o cronograma.</div></div>`;
  if(!rows.length)return `<div class="view">${head}<div class="notice"><strong>Nada neste filtro.</strong></div></div>`;
  let mn=Math.min(...rows.map(t=>pd(t.inicio))),mx=Math.max(...rows.map(t=>pd(t.fim)||pd(t.inicio)));
  let start=new Date(mn);start=addD(start,-((start.getDay()+6)%7));
  let end=addD(new Date(mx),10);
  const W=window.innerWidth<640?11:15;const days=diff(end,start)+1;const width=days*W;
  const x=d=>diff(d,start)*W;

function weeklyText(){
  const sexta=addD(today,(5-today.getDay()+7)%7);const seg=addD(sexta,3),prox=addD(sexta,9);
  const intT=D.tarefas.filter(interior),done=intT.filter(isDone).length;
  const andam=D.tarefas.filter(t=>t.status==="Em andamento");
  const late=D.tarefas.filter(lateTask);
  const openDec=D.decisoes.filter(d=>d.status!=="Respondida").sort((a,b)=>(a.prazo||"").localeCompare(b.prazo||""));
  const ris=D.riscos.filter(r=>r.status!=="Fechado").sort((a,b)=>({Alto:0,Médio:1,Baixo:2}[a.impacto]??3)-({Alto:0,Médio:1,Baixo:2}[b.impacto]??3));
  const nxt=D.tarefas.filter(t=>{const s=pd(t.inicio),f=pd(t.fim);return !isDone(t)&&((s&&s>=seg&&s<=prox)||(f&&f>=seg&&f<=prox))}).sort((a,b)=>(a.inicio||"").localeCompare(b.inicio||""));
  const ent=D.pedidos.filter(p=>{const d=pd(p.previsao);return d&&d>=seg&&d<=prox&&p.status!=="Entregue"});
  const lic=D.licencas.filter(l=>l.status&&l.status!=="Encerrada");
  const delay=clientDelayDays();
  const L=[];
  L.push(`RELATÓRIO SEMANAL — ${PROJ.nome}`);
  L.push(`Semana encerrada em ${fd(iso(sexta))} · Gerente de projeto: ${PROJ.gerente}`);
  L.push("");
  L.push("1. SITUAÇÃO");
  if(intT.length)L.push(`• ${PROJ.interno?"Trabalho interno":"Cronograma"}: ${done} de ${intT.length} tarefas concluídas.${pd(PROJ.conclusaoInterna)?` Meta de conclusão: ${fd(PROJ.conclusaoInterna)} (${Math.max(0,diff(pd(PROJ.conclusaoInterna),today))} dias).`:""}`);
  if(D.punch.length){const po=openPunch();const ur=po.filter(p=>p.urgente==="Sim");L.push(`• Punch list: ${D.punch.length-po.length} de ${D.punch.length} itens fechados; ${po.length} abertos${ur.length?`, ${ur.length} urgente(s): ${ur.map(p=>p.item).join("; ")}`:""}.`)}
  if(andam.length)L.push(`• Em andamento: ${andam.map(t=>t.nome).join("; ")}.`);
  L.push(late.length?`• Atrasadas: ${late.map(t=>`${t.nome} (previsto ${fd(t.fim)})`).join("; ")}.`:"• Nenhuma tarefa atrasada.");
  if(lic.length)L.push(`• Licenças: ${lic.map(l=>`${l.nome} — ${l.status}`).join("; ")}.`);
  L.push("");
  L.push("2. RISCOS");
  ris.length?ris.forEach(r=>L.push(`• [${r.impacto||"—"}] ${r.risco}${r.mitigacao?` Mitigação: ${r.mitigacao}`:""}`)):L.push("• Nenhum risco aberto.");
  L.push("");
  L.push("3. DECISÕES NECESSÁRIAS DO CONTRATANTE");
  openDec.length?openDec.forEach(d=>L.push(`• ${d.pergunta} — responder até ${fd(d.prazo)}${pd(d.prazo)&&pd(d.prazo)<today?" (PRAZO VENCIDO)":""}`)):L.push("• Nenhuma decisão pendente.");
  if(delay)L.push(`• Atraso acumulado em respostas do Contratante: ${delay} dia(s), que prorrogam o prazo do bônus (cláusula 6.3).`);
  L.push("");
  L.push(`4. ENTREGAS DA PRÓXIMA SEMANA (${fd(iso(seg))} a ${fd(iso(addD(seg,5)))})`);
  nxt.length?nxt.forEach(t=>L.push(`• ${fd(t.inicio)}–${fd(t.fim)}: ${t.nome}${t.resp?` (${t.resp})`:""}`)):L.push("• Nenhuma tarefa programada.");
  ent.forEach(p=>L.push(`• Entrega prevista ${fd(p.previsao)}: ${p.item}`));
  return L.join("\n");
}

function parsePath(path){const s=path.split("/");return s.length===1?{t:"p"}:{t:"d",projeto:s[1],colecao:s[2]}}
async function fetchRows(P){
  if(P.t==="p"){const{data,error}=await sb.from("obra_projetos").select("id,data");if(error)throw mapErr(error);return data}
  const{data,error}=await sb.from("obra_docs").select("id,data").eq("projeto",P.projeto).eq("colecao",P.colecao);if(error)throw mapErr(error);return data;
}
function makeDb(){return{collection(path){
  const P=parsePath(path);
  const tbl=P.t==="p"?"obra_projetos":"obra_docs";
  const key=id=>P.t==="p"?{id}:{projeto:P.projeto,colecao:P.colecao,id};
  const match=(q,id)=>{const k=key(id);Object.keys(k).forEach(c=>q=q.eq(c,k[c]));return q};
  const docRef=id=>({id,
    async set(data){const{error}=await sb.from(tbl).upsert({...key(id),data,updated_at:new Date().toISOString()});if(error)throw mapErr(error);kick(path)},
    async update(patch){const{data:row,error:e1}=await match(sb.from(tbl).select("data"),id).maybeSingle();if(e1)throw mapErr(e1);
      const{error}=await match(sb.from(tbl).update({data:{...(row?row.data:{}),...patch},updated_at:new Date().toISOString()}),id);if(error)throw mapErr(error);kick(path)},
    async delete(){const{error}=await match(sb.from(tbl).delete(),id);if(error)throw mapErr(error);kick(path)}
  });
  return{
    doc(id){return docRef(id||uid())},
    async add(data){const id=uid();await docRef(id).set(data);return docRef(id)},
    onSnapshot(next,onErr){
      let alive=true,t=null;
      const load=()=>{clearTimeout(t);t=setTimeout(async()=>{try{const rows=await fetchRows(P);if(alive)next({docs:rows.map(r=>({id:r.id,data:()=>r.data||{}}))})}catch(e){if(alive&&onErr)onErr(e)}},120)};
      (listeners[path]=listeners[path]||[]).push(load);
      const ch=sb.channel("rt-"+path.replace(/\W/g,"-")+"-"+uid()).on("postgres_changes",{event:"*",schema:"public",table:tbl,...(P.t==="d"?{filter:"projeto=eq."+P.projeto}:{})},()=>load()).subscribe();
      load();
      return()=>{alive=false;clearTimeout(t);listeners[path]=(listeners[path]||[]).filter(f=>f!==load);sb.removeChannel(ch)};
    }
  };
}}}
let MEMB=[], EMAIL="";
function papelEm(pid){const r=MEMB.filter(m=>m.projeto===pid||m.projeto==="*");if(r.some(m=>m.papel==="equipe"))return"equipe";return r.length?"cliente":null}
function applyAccess(){
  canWrite=ROUTE.mode!=="cliente"&&papelEm(PROJ.id)==="equipe";
  document.body.classList.toggle("readonly",!canWrite);
}
function showLogin(msg){
  $("tabs").innerHTML="";$("projBar").innerHTML="";$("facts").innerHTML="";$("pName").textContent="Painel de Obra";
  $("conn").textContent="Acesso restrito à equipe APLUS e aos clientes convidados.";
  $("main").innerHTML=`<div class="view" style="max-width:440px"><h2 class="sec">Entrar</h2><p class="sec-sub">Digite seu e-mail. Enviamos um link de acesso; depois do primeiro login, este navegador continua conectado.</p>
  <form id="loginForm" class="fld" style="gap:10px"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" required autocomplete="email" placeholder="voce@exemplo.com"><button class="btn" type="submit">Enviar link de acesso</button></form>
  ${msg?`<div class="notice">${msg}</div>`:""}</div>`;
  $("loginForm").addEventListener("submit",async e=>{e.preventDefault();const email=$("loginEmail").value.trim();if(!email)return;
    const btn=e.target.querySelector("button");btn.disabled=true;btn.textContent="Enviando…";
    const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});
    if(error){btn.disabled=false;btn.textContent="Enviar link de acesso";toast("Não enviou: "+error.message)}
    else $("main").innerHTML=`<div class="notice" style="max-width:440px"><strong>Link enviado para ${esc(email)}.</strong><br>Abra o e-mail e clique no link. Funciona no computador ou no celular.</div>`});
}
/* ---------- Boot ---------- */
document.addEventListener("change",e=>{if(e.target.id==="projSel")switchProject(e.target.value)});
let unsubs=[], loadTimer=null, projUnsub=null;
function subscribeProject(){
  unsubs.forEach(u=>{try{u()}catch(_){}});unsubs=[];
  Object.keys(S).forEach(k=>{D[k]=[];delete got[k]});loaded=false;Object.keys(F).forEach(k=>delete F[k]);
  render();
  clearTimeout(loadTimer);
  loadTimer=setTimeout(()=>{if(!loaded){loaded=true;$("conn").textContent="O banco de dados está demorando a responder. Os dados podem estar incompletos.";render()}},10000);
  const keys=Object.keys(S), pid=PROJ.id;
  keys.forEach(k=>{
    unsubs.push(db.collection(col(k)).onSnapshot(s=>{
      if(PROJ.id!==pid)return;
      D[k]=s.docs.map(d=>({id:d.id,...d.data()}));got[k]=true;
      if(keys.every(x=>got[x])){if(!loaded)clearTimeout(loadTimer);loaded=true;
        $("conn").textContent=(canWrite?"Sincronizado em tempo real":"Modo leitura")+" · "+EMAIL+" · atualizado "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}
      if(loaded&&!editing)render(); else if(loaded) renderTabs();
    },err=>{clearTimeout(loadTimer);loaded=true;$("conn").textContent="Não foi possível ler os dados deste projeto.";render()}));
  });
}
function switchProject(id){
  HIST={pid:null,rows:[],loading:false,err:""};
  const p=PROJS.find(x=>x.id===id);if(!p)return;
  applyProject(p);applyAccess();try{localStorage.setItem("aplus-proj",id)}catch(_){}
  const want="/"+ROUTE.mode+"/"+encodeURIComponent(id);
  if(location.pathname!==want)try{history.replaceState(null,"",want)}catch(_){}
  if(!TABS.some(t=>t[0]===tab))tab="geral";
  renderMast();subscribeProject();
}
async function start(session){
  EMAIL=(session.user.email||"").toLowerCase();
  db=makeDb();
  const{data:m}=await sb.from("obra_membros").select("projeto,papel").eq("email",EMAIL);
  MEMB=m||[];
  if(ROUTE.mode==="cliente"){for(let i=TABS.length-1;i>=0;i--)if(["pacotes","cotacoes","pagamentos","historico"].includes(TABS[i][0]))TABS.splice(i,1)}
  if(!MEMB.length){$("main").innerHTML=`<div class="notice"><strong>O e-mail ${esc(EMAIL)} ainda não tem acesso a nenhum projeto.</strong><br>Peça à APLUS para liberar seu acesso. <button class="btn ghost" id="logout" style="margin-top:10px">Sair</button></div>`;$("tabs").innerHTML="";$("projBar").innerHTML="";return}
  let first=true;
  if(projUnsub)projUnsub();
  projUnsub=db.collection("projetos").onSnapshot(s=>{
    PROJS=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.nome||"").localeCompare(b.nome||""));
    if(!PROJS.length){$("main").innerHTML=`<div class="notice"><strong>Nenhum projeto liberado para ${esc(EMAIL)}.</strong></div>`;return}
    if(first){first=false;
      let want=ROUTE.proj;if(!PROJS.some(p=>p.id===want)){try{want=localStorage.getItem("aplus-proj")}catch(_){want=null}}
      if(!PROJS.some(p=>p.id===want))want=PROJS[0].id;
      switchProject(want);
    }else{const cur=PROJS.find(p=>p.id===PROJ.id);if(cur){applyProject(cur);renderMast();if(!editing)render()}else renderMast()}
  },()=>{$("conn").textContent="Não foi possível carregar os projetos."});
}
document.addEventListener("click",async e=>{if(e.target.id==="logout"){await sb.auth.signOut();location.reload()}});
try{const s=localStorage.getItem("aplus-tab");if(s&&TABS.some(t=>t[0]===s))tab=s}catch(_){}
renderMast();
(async()=>{
  // Erro devolvido pelo link (ex.: link expirado ou já usado)
  const hp=new URLSearchParams(location.hash.slice(1)), qp=new URLSearchParams(location.search);
  const linkErr=hp.get("error_description")||qp.get("error_description");
  // Link no formato ?code= (pedido numa versão anterior da página): troca o código pela sessão
  let{data:{session}}=await sb.auth.getSession();   // lê os tokens do link (#access_token) antes de limpar a URL
  if(!session&&qp.get("code")){try{const r=await sb.auth.exchangeCodeForSession(qp.get("code"));session=r.data&&r.data.session}catch(_){}}
  if(location.search||location.hash){try{history.replaceState(null,"",location.pathname)}catch(_){}}
  if(session)start(session);else showLogin(linkErr?`<strong>O link não funcionou:</strong> ${esc(linkErr.replace(/\+/g," "))}.<br>Peça um link novo abaixo.`:(qp.get("code")?"<strong>O link não funcionou neste navegador.</strong><br>Peça um link novo abaixo e abra o e-mail no mesmo aparelho.":""));
  let started=!!session;
  sb.auth.onAuthStateChange((ev,s)=>{if(s&&!started){started=true;start(s)}if(ev==="SIGNED_OUT"){started=false;showLogin()}});
})();
</script>
